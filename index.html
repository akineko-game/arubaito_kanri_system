<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>アルバイト管理統合システム</title>
  <link rel="stylesheet" href="style.css?v=20260528_today_shift_actual" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.6.0/dist/tabler-icons.min.css" />
</head>
<body>

<div class="app-shell">

  <!-- ヘッダー -->
  <header class="app-header">
    <div class="app-logo">
      <i class="ti ti-building-store" aria-hidden="true"></i>
      アルバイト管理システム
    </div>
    <div class="header-spacer"></div>
    <div id="state-panel"></div>
  </header>

  <!-- サイドバー（JS で描画） -->
  <aside class="app-sidebar" id="app-sidebar"></aside>

  <!-- メイン -->
  <main class="app-main">

    <!-- 進捗ステッパー -->
    <div class="progress-stepper-wrap">
      <div class="stepper-title"><i class="ti ti-route" aria-hidden="true"></i> 状態進行モデル</div>
      <div id="progress-stepper"></div>
    </div>

    <!-- ガイドカード + メインビュー -->
    <div class="content-row">
      <div style="display:flex;flex-direction:column;gap:16px;">
        <div class="guide-card"><div id="guide-box">読み込み中...</div></div>
        <div id="main-view"></div>
      </div>
      <div class="log-panel">
        <div class="log-panel-header">
          <i class="ti ti-activity" aria-hidden="true"></i>状態遷移ログ
        </div>
        <div id="transition-log"></div>
      </div>
    </div>

    <!-- スタッフ一覧（店長・管理者のみ表示） -->
    <div id="staff-list-panel" class="staff-list-panel"></div>

    <!-- Undefined 明示 -->
    <div class="undefined-notice">
      <strong>Undefined（SDS未定義のため実装なし）:</strong>
      シフト同時編集競合制御 / 打刻改ざん対策 / GPS併用 / CSV項目定義 / バックアップ復元方式 /
      通知テンプレ編集 / 臨時休業中の給与扱い / 労基法警告範囲 / 店舗管理機能詳細 / 将来LINE認証方式
    </div>

  </main>
</div>

<div id="global-error" role="alert" aria-live="polite"></div>
<script src="app.js?v=20260528_today_shift_actual"></script>
</body>
</html>
