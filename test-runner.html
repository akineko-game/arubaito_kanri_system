<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>テストランナー — アルバイト管理システム</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.6.0/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f4f0; --surface: #fff; --border: rgba(0,0,0,.10);
      --text-1: #1a1a18; --text-2: #5a5a56; --text-3: #909088;
      --ok: #2d7a4f; --ok-bg: #eaf3de;
      --warn: #b07010; --warn-bg: #faeeda;
      --error: #a32d2d; --error-bg: #fcebeb;
      --primary: #1e5fa8; --primary-bg: #e6f1fb;
      --radius: 10px;
    }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      font-size: 14px; background: var(--bg); color: var(--text-1);
      display: flex; flex-direction: column;
    }

    /* ヘッダー */
    .header {
      background: var(--surface); border-bottom: .5px solid var(--border);
      padding: 0 16px; height: 48px; min-height: 48px;
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    .header-title { font-size: 15px; font-weight: 700; color: var(--primary); }
    .header-spacer { flex: 1; }
    .speed-wrap { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); }
    .speed-wrap input { width: 80px; }

    /* レイアウト */
    .main { display: grid; grid-template-columns: 320px 1fr; flex: 1; min-height: 0; overflow: hidden; }

    /* 左ペイン */
    .control-pane {
      background: var(--surface); border-right: .5px solid var(--border);
      display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    }
    .control-toolbar {
      padding: 8px 10px; border-bottom: .5px solid var(--border);
      display: flex; gap: 5px; flex-wrap: wrap; flex-shrink: 0;
    }
    .btn {
      padding: 6px 11px; border-radius: var(--radius); font-size: 12px;
      font-weight: 500; cursor: pointer; border: .5px solid transparent;
      font-family: inherit; display: inline-flex; align-items: center; gap: 4px;
      transition: all .12s;
    }
    .btn-run    { background: var(--ok);       color: #fff;             border-color: var(--ok); }
    .btn-pause  { background: var(--warn-bg);  color: var(--warn);      border-color: var(--warn); }
    .btn-stop   { background: var(--error-bg); color: var(--error);     border-color: var(--error); }
    .btn-reset  { background: var(--bg);       color: var(--text-2);    border-color: var(--border); }
    .btn-custom { background: #eeedfe;         color: #534ab7;          border-color: #afa9ec; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }

    /* シナリオリスト */
    .scenario-pane { flex: 1; min-height: 0; overflow-y: auto; }
    .scenario-group { border-bottom: .5px solid var(--border); }
    .scenario-group-header {
      padding: 7px 12px 4px;
      font-size: 10px; font-weight: 700; color: var(--text-3);
      letter-spacing: .07em; text-transform: uppercase;
      background: var(--bg); position: sticky; top: 0; z-index: 1;
    }
    .scenario-group-header.g-unit    { color: #185fa5; background: #eef5fc; }
    .scenario-group-header.g-30days  { color: #2d7a4f; background: #eaf3de; }
    .scenario-group-header.g-3months { color: #7c3f9e; background: #f3eefe; }
    .scenario-group-header.g-custom  { color: #534ab7; background: #eeedfe; }

    .scenario-btn {
      display: block; width: 100%; padding: 7px 14px;
      background: none; border: none; border-bottom: .5px solid var(--border);
      text-align: left; cursor: pointer; font-size: 12px;
      font-family: inherit; color: var(--text-1); transition: background .1s;
      line-height: 1.4;
    }
    .scenario-btn:hover { background: var(--primary-bg); }
    .scenario-btn.active { background: var(--primary-bg); color: var(--primary); font-weight: 600; }
    .scenario-btn .s-tag {
      display: inline-block; font-size: 10px; font-weight: 600;
      padding: 1px 6px; border-radius: 8px; margin-right: 5px;
      vertical-align: middle;
    }
    .s-tag.unit    { background: #e6f1fb; color: #185fa5; }
    .s-tag.days30  { background: #eaf3de; color: #2d7a4f; }
    .s-tag.months3 { background: #f3eefe; color: #7c3f9e; }

    /* ステップログ */
    .step-log-wrap { height: 220px; min-height: 220px; border-top: .5px solid var(--border); overflow-y: auto; flex-shrink: 0; }
    .step-item {
      padding: 5px 10px; border-bottom: .5px solid var(--border);
      display: grid; grid-template-columns: 18px 1fr auto;
      gap: 6px; align-items: start; font-size: 11px;
    }
    .step-icon { font-size: 13px; margin-top: 1px; }
    .step-icon.ok    { color: var(--ok); }
    .step-icon.warn  { color: var(--warn); }
    .step-icon.error { color: var(--error); }
    .step-icon.run   { color: var(--primary); }
    .step-icon.idle  { color: var(--text-3); }
    .step-label  { font-weight: 600; color: var(--text-1); }
    .step-detail { color: var(--text-2); font-size: 10px; }
    .step-status { font-size: 10px; color: var(--text-3); white-space: nowrap; }

    /* 進捗バー */
    .progress-bar-wrap { height: 4px; background: var(--border); flex-shrink: 0; }
    .progress-bar-fill { height: 100%; background: var(--primary); transition: width .3s; }

    /* カスタムパネル */
    .custom-panel {
      border-top: .5px solid var(--border); flex-direction: column;
      background: var(--surface); flex-shrink: 0; max-height: 55%;
    }
    .custom-panel-header {
      padding: 6px 12px; border-bottom: .5px solid var(--border);
      font-size: 12px; font-weight: 600; color: #534ab7;
      display: flex; justify-content: space-between; align-items: center;
    }
    .custom-close { background: none; border: none; cursor: pointer; color: var(--text-3); font-size: 15px; padding: 2px; }
    .custom-close:hover { color: var(--text-1); }
    #custom-json {
      border: none; border-bottom: .5px solid var(--border);
      padding: 8px 12px;
      font-family: 'Menlo','Monaco',monospace; font-size: 11px; line-height: 1.6;
      resize: none; background: #faf8f2; color: #2c2c28;
      min-height: 120px; max-height: 160px; outline: none; width: 100%;
    }
    .custom-actions { padding: 6px 12px; display: flex; gap: 6px; border-bottom: .5px solid var(--border); }
    .custom-help { padding: 6px 12px; overflow-y: auto; max-height: 100px; }
    .custom-help-title { font-size: 10px; font-weight: 700; color: var(--text-3); letter-spacing: .05em; text-transform: uppercase; margin-bottom: 3px; }
    .custom-help-item { font-size: 10px; color: var(--text-2); padding: 1px 0; display: flex; gap: 6px; }
    .custom-help-item code { background: #eeedfe; color: #534ab7; padding: 0 4px; border-radius: 3px; font-size: 10px; }
    .custom-help-item span { color: var(--text-3); }

    /* 右ペイン */
    .preview-pane { display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
    .preview-bar {
      background: var(--surface); border-bottom: .5px solid var(--border);
      padding: 5px 12px; font-size: 11px; color: var(--text-2);
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .preview-state {
      background: var(--primary-bg); color: var(--primary);
      padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600;
    }
    #app-frame { flex: 1; border: none; width: 100%; height: 100%; min-height: 0; display: block; }
  </style>
</head>
<body>

<div class="header">
  <i class="ti ti-test-pipe" style="font-size:19px;color:var(--primary)"></i>
  <span class="header-title">テストランナー</span>
  <span style="font-size:11px;color:var(--text-3)">アルバイト管理統合システム</span>
  <div class="header-spacer"></div>
  <div class="speed-wrap">
    <i class="ti ti-gauge"></i>間隔
    <input type="range" id="speed-range" min="200" max="3000" step="100" value="800" />
    <span id="speed-label">0.8秒</span>
  </div>
</div>

<div class="main">
  <div class="control-pane">

    <div class="control-toolbar">
      <button class="btn btn-run"   id="btn-run"    onclick="runScenario()" disabled><i class="ti ti-player-play"></i> 実行</button>
      <button class="btn btn-pause" id="btn-pause"   onclick="pauseScenario()" disabled><i class="ti ti-player-pause"></i> 停止</button>
      <button class="btn btn-run"   id="btn-resume"  onclick="resumeScenario()" disabled style="display:none"><i class="ti ti-player-play"></i> 再開</button>
      <button class="btn btn-stop"  id="btn-stop"    onclick="stopScenario()" disabled><i class="ti ti-player-stop"></i> 中止</button>
      <button class="btn btn-reset" id="btn-reset"   onclick="resetAll()"><i class="ti ti-refresh"></i> リセット</button>
      <button class="btn btn-custom"                 onclick="toggleCustomPanel()"><i class="ti ti-code"></i> カスタム</button>
    </div>

    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-bar" style="width:0%"></div></div>

    <div class="scenario-pane" id="scenario-pane">
      <!-- JSで描画 -->
    </div>

    <div class="step-log-wrap" id="step-log"></div>

    <!-- カスタムパネル -->
    <div class="custom-panel" id="custom-panel" style="display:none">
      <div class="custom-panel-header">
        <span><i class="ti ti-code"></i> カスタムシナリオ</span>
        <button class="custom-close" onclick="closeCustomPanel()"><i class="ti ti-x"></i></button>
      </div>
      <textarea id="custom-json" spellcheck="false" placeholder='{ "title": "バグ再現", "steps": [ {"action":"reset"}, {"action":"loginAsStaff","staffId":7} ] }'></textarea>
      <div class="custom-actions">
        <button class="btn btn-reset" onclick="loadCustomScenario()"><i class="ti ti-upload"></i> 読み込む</button>
        <button class="btn btn-run" onclick="loadAndRun()" id="btn-custom-run" disabled><i class="ti ti-player-play"></i> 読込んで実行</button>
      </div>
      <div class="custom-help">
        <div class="custom-help-title">使えるアクション</div>
        <div class="custom-help-item"><code>reset</code> <span>全初期化</span></div>
        <div class="custom-help-item"><code>loginAsStaff</code> <span>staffId</span></div>
        <div class="custom-help-item"><code>logout</code></div>
        <div class="custom-help-item"><code>addShiftRequest</code> <span>date/start/end</span></div>
        <div class="custom-help-item"><code>transition</code> <span>event: イベント名</span></div>
        <div class="custom-help-item"><code>confirmShift</code> <span>date/staffId</span></div>
        <div class="custom-help-item"><code>jumpToState</code> <span>state: 状態名</span></div>
        <div class="custom-help-item"><code>confirmAttendance</code> <span>staffId</span></div>
        <div class="custom-help-item"><code>approveAbsence</code> <span>staffId</span></div>
        <div class="custom-help-item"><code>setClockIn</code> <span>staffId/time</span></div>
        <div class="custom-help-item"><code>setClockOut</code> <span>staffId/time</span></div>
      </div>
    </div>
  </div>

  <div class="preview-pane">
    <div class="preview-bar">
      <i class="ti ti-device-desktop"></i>
      <span class="preview-state" id="preview-state">接続待ち…</span>
      <span id="preview-who"></span>
      <span id="preview-step" style="margin-left:auto;color:var(--text-3)"></span>
    </div>
    <iframe id="app-frame" src="index.html"></iframe>
  </div>
</div>

<script>
/* ═══════════════════════════════════
   シナリオ定義
   グループ: unit / days30 / months3 / custom
═══════════════════════════════════ */
const SCENARIO_GROUPS = [

  /* ──────────────────────────────────────
     機能テスト（ユニット）
  ────────────────────────────────────── */
  {
    id: 'unit', label: '機能テスト', cls: 'g-unit',
    scenarios: [

      { title: 'ログイン・ログアウト', steps: [
        { label: 'リセット',         action: () => A().reset() },
        { label: 'アルバイトログイン',action: () => A().loginAsStaff(7),  detail: '田中花子' },
        { label: '状態確認',          action: () => assert(A().getCurrentRole()==='part_time', 'ロールがpart_time') },
        { label: 'ログアウト',        action: () => A().logout() },
        { label: '未ログイン確認',    action: () => assert(A().getCurrentState()==='未ログイン', 'ログアウト後は未ログイン') },
        { label: '店長ログイン',      action: () => A().loginAsStaff(3),   detail: '山田太郎' },
        { label: 'ロール確認',        action: () => assert(A().getCurrentRole()==='manager', 'ロールがmanager') },
        { label: 'ログアウト',        action: () => A().logout() },
        { label: '管理者ログイン',    action: () => A().loginAsStaff(1),   detail: '佐藤健一' },
        { label: 'ロール確認',        action: () => assert(A().getCurrentRole()==='admin', 'ロールがadmin') },
        { label: '完了',              action: () => A().logout() },
      ]},

      { title: '勤務希望提出フロー', steps: [
        { label: 'リセット',          action: () => A().reset() },
        { label: '田中花子ログイン',  action: () => A().loginAsStaff(7) },
        { label: '希望を追加①',      action: () => { A().setFormValue('inp-shift-date','2025-08-05'); A().setFormValue('inp-shift-start','10:00'); A().setFormValue('inp-shift-end','18:00'); F().addShiftRequest(); }, detail: '8/5 10-18' },
        { label: '希望を追加②',      action: () => { A().setFormValue('inp-shift-date','2025-08-07'); A().setFormValue('inp-shift-start','13:00'); A().setFormValue('inp-shift-end','21:00'); F().addShiftRequest(); }, detail: '8/7 13-21' },
        { label: '重複チェック',      action: () => { A().setFormValue('inp-shift-date','2025-08-05'); F().addShiftRequest(); }, detail: '同日は弾かれる' },
        { label: '件数確認',          action: () => assert(A().getShiftRequests().filter(r=>r.staffId===7).length===2, '重複なし2件') },
        { label: '提出',              action: () => A().transition('SHIFT_REQUEST_SUBMIT') },
        { label: '状態確認',          action: () => assert(A().getCurrentState()==='勤務希望提出済', '提出済みに遷移') },
      ]},

      { title: 'シフト作成・確定・公開', steps: [
        { label: 'リセット',          action: () => A().reset() },
        { label: '田中花子：希望提出', action: () => { A().loginAsStaff(7); A().setFormValue('inp-shift-date','2025-08-05'); A().setFormValue('inp-shift-start','10:00'); A().setFormValue('inp-shift-end','18:00'); F().addShiftRequest(); A().transition('SHIFT_REQUEST_SUBMIT'); A().logout(); } },
        { label: '山田太郎ログイン',  action: () => A().loginAsStaff(3) },
        { label: '割当確定',          action: () => A().confirmShift('2025-08-05', 7),  detail: '田中花子8/5' },
        { label: 'シフト確定',        action: () => A().transition('SHIFT_CONFIRM') },
        { label: '状態確認',          action: () => assert(A().getShiftPhase('渋谷店')==='confirmed', '確定済みフェーズ') },
        { label: 'スタッフへ公開',    action: () => A().transition('SHIFT_PUBLISH') },
        { label: '公開確認',          action: () => assert(A().getShiftPhase('渋谷店')==='published', '公開済みフェーズ') },
        { label: '田中花子の状態確認',action: () => assert(A().getStaff(7).state==='シフト公開済', 'SHIFT_PUBLISHED') },
      ]},

      { title: '出退勤・休憩フロー', steps: [
        { label: 'リセット',          action: () => A().reset() },
        { label: '田中花子ログイン',  action: () => { A().loginAsStaff(7); A().jumpToState('出勤前'); } },
        { label: '出勤打刻',          action: () => A().transition('CLOCK_IN') },
        { label: '出勤中確認',        action: () => assert(A().getCurrentState()==='出勤中', '出勤中') },
        { label: '休憩開始',          action: () => A().transition('BREAK_START') },
        { label: '休憩中確認',        action: () => assert(A().getCurrentState()==='休憩中', '休憩中') },
        { label: '休憩終了',          action: () => A().transition('BREAK_END') },
        { label: '出勤中に戻る',      action: () => assert(A().getCurrentState()==='出勤中', '出勤中に復帰') },
        { label: '退勤打刻',          action: () => A().transition('CLOCK_OUT') },
        { label: '勤怠未確定確認',    action: () => assert(A().getCurrentState()==='勤怠未確定', '勤怠未確定') },
      ]},

      { title: '欠勤申請・代替募集フロー', steps: [
        { label: 'リセット',              action: () => A().reset() },
        { label: '福田ひよりにシフト付与', action: () => { F().DEMO.shiftRequests.push({staffId:33,date:'2025-08-05',start:'10:00',end:'18:00'}); A().confirmShift('2025-08-05',33); } },
        { label: '山田太郎で確定・公開',  action: () => { A().loginAsStaff(3); A().transition('SHIFT_CONFIRM'); A().transition('SHIFT_PUBLISH'); A().logout(); } },
        { label: '福田ひよりログイン',    action: () => A().loginAsStaff(33) },
        { label: '欠勤申請',              action: () => { F().appState.currentState='欠勤申請中'; F().DEMO.staff.find(s=>s.id===33).state='欠勤申請中'; F().updateGuideOnStateChange(); }, detail: '欠勤申請中へ' },
        { label: 'ログアウト',            action: () => A().logout() },
        { label: '山田太郎ログイン',      action: () => A().loginAsStaff(3) },
        { label: '欠勤承認',              action: () => F().approveAbsence(33) },
        { label: '代替募集中確認',        action: () => assert(A().getStaff(33).state==='代替募集中', '代替募集中') },
      ]},

      { title: '残業申請フロー', steps: [
        { label: 'リセット',          action: () => A().reset() },
        { label: '田中花子ログイン',  action: () => { A().loginAsStaff(7); A().jumpToState('出勤中'); } },
        { label: '残業申請状態へ',    action: () => { F().appState.currentState='残業申請中'; F().DEMO.staff.find(s=>s.id===7).state='残業申請中'; F().updateGuideOnStateChange(); } },
        { label: 'ログアウト',        action: () => A().logout() },
        { label: '山田太郎ログイン',  action: () => A().loginAsStaff(3) },
        { label: '残業承認',          action: () => F().approveOvertime(7) },
        { label: '出勤中に戻る確認',  action: () => assert(A().getStaff(7).state==='出勤中', '承認後は出勤中') },
      ]},

      { title: '勤怠確定・給与計算フロー', steps: [
        { label: 'リセット',          action: () => A().reset() },
        { label: '管理者ログイン',    action: () => A().loginAsStaff(1) },
        { label: '金子海斗の打刻セット', action: () => { const s=F().DEMO.staff.find(s=>s.id===38); s.clockIn='10:00'; s.clockOut='18:08'; s.state='勤怠未確定'; } },
        { label: '内田朱音の打刻セット', action: () => { const s=F().DEMO.staff.find(s=>s.id===43); s.clockIn='10:00'; s.clockOut='18:00'; s.state='勤怠未確定'; } },
        { label: '金子海斗の勤怠確定', action: () => F().confirmAttendance(38) },
        { label: '内田朱音の勤怠確定', action: () => F().confirmAttendance(43) },
        { label: '状態確認',          action: () => { assert(F().DEMO.staff.find(s=>s.id===38).state==='給与未計算','金子：給与未計算'); assert(F().DEMO.staff.find(s=>s.id===43).state==='給与未計算','内田：給与未計算'); } },
        { label: '給与計算',          action: () => { A().jumpToState('給与未計算'); A().transition('SALARY_CALC'); } },
        { label: '完了',              action: () => {} },
      ]},

      { title: '権限制御テスト', steps: [
        { label: 'リセット',              action: () => A().reset() },
        { label: 'アルバイトログイン',    action: () => A().loginAsStaff(7) },
        { label: 'SHIFT_CONFIRM拒否確認', action: () => { const r=A().transition('SHIFT_CONFIRM'); assert(r===false, 'アルバイトはSHIFT_CONFIRMできない'); }, detail: '権限外イベントは弾かれる' },
        { label: 'SALARY_CALC拒否確認',  action: () => { const r=A().transition('SALARY_CALC'); assert(r===false, 'アルバイトはSALARY_CALCできない'); } },
        { label: 'ログアウト',            action: () => A().logout() },
        { label: '店長ログイン',          action: () => A().loginAsStaff(3) },
        { label: 'SALARY_CALC拒否確認',  action: () => { const r=A().transition('SALARY_CALC'); assert(r===false, '店長はSALARY_CALCできない'); } },
        { label: '完了',                  action: () => {} },
      ]},

      { title: '未成年者深夜制限テスト', steps: [
        { label: 'リセット',              action: () => A().reset() },
        { label: '小林さくらログイン',    action: () => A().loginAsStaff(9),  detail: '17歳・未成年' },
        { label: '出勤前へ移動',          action: () => A().jumpToState('出勤前') },
        { label: '未成年フラグ確認',      action: () => assert(A().getStaff(9).isMinor===true, 'isMinor=true') },
        { label: '完了',                  action: () => {} },
      ]},

/* ═══════════════════════════════════
   ランナー本体
═══════════════════════════════════ */
let API = null;
let currentGroupId  = 'unit';
let currentScenIdx  = 0;
let steps    = [];
let stepIdx  = 0;
let running  = false;
let paused   = false;
let stopped  = false;
let timer    = null;
let assertErrors = 0;

const frame = document.getElementById('app-frame');

/* iframe接続ポーリング */
function connectAPI() {
  let attempts = 0;
  const poll = setInterval(() => {
    attempts++;
    try {
      const api = frame.contentWindow?.ShiftAPI;
      if (api && typeof api.reset === 'function') {
        clearInterval(poll);
        API = api;
        API.on((event, data) => {
          document.getElementById('preview-state').textContent = data.state || '—';
          const who = document.getElementById('preview-who');
          who.textContent = data.staff ? '（' + data.staff + '）' : '';
        });
        document.getElementById('preview-state').textContent = '接続済み';
        document.getElementById('btn-run').disabled = false;
        document.getElementById('btn-custom-run').disabled = false;
        log('info', 'システム接続完了', attempts * 200 + 'ms');
        renderScenarioList();
      } else if (attempts >= 40) {
        clearInterval(poll);
        log('error', '接続タイムアウト', 'ページを再読み込みしてください');
      }
    } catch(e) {}
  }, 200);
}
frame.addEventListener('load', connectAPI);
if (frame.contentDocument?.readyState === 'complete') connectAPI();

/* shorthand */
function A() { return API; }
function F() { return frame.contentWindow; }

/* アサーション */
function assert(cond, msg) {
  if (!cond) {
    assertErrors++;
    throw new Error('ASSERT FAIL: ' + msg);
  }
}

/* スピード */
document.getElementById('speed-range').addEventListener('input', function() {
  document.getElementById('speed-label').textContent = (this.value/1000).toFixed(1) + '秒';
});
function getDelay() { return Number(document.getElementById('speed-range').value); }

/* ── シナリオリスト描画 ── */
function renderScenarioList() {
  const pane = document.getElementById('scenario-pane');
  pane.innerHTML = SCENARIO_GROUPS.map(g => {
    const rows = g.scenarios.map((sc, i) => {
      const active = g.id === currentGroupId && i === currentScenIdx;
      return '<button class="scenario-btn' + (active?' active':'') + '" onclick="selectScenario(\'' + g.id + '\',' + i + ')">'
        + '<span class="s-tag ' + g.id + '">' + g.scenarios.length + '/' + (i+1) + '</span>'
        + sc.title
        + ' <span style="color:var(--text-3);font-size:10px">（' + sc.steps.length + 'ステップ）</span>'
        + '</button>';
    }).join('');
    return '<div class="scenario-group">'
      + '<div class="scenario-group-header ' + g.cls + '"><i class="ti ti-' + (g.id==='unit'?'test-pipe':g.id==='days30'?'calendar-month':'calendar-stats') + '"></i> ' + g.label + '</div>'
      + rows + '</div>';
  }).join('');
}

function selectScenario(groupId, idx) {
  currentGroupId = groupId;
  currentScenIdx = idx;
  const group = SCENARIO_GROUPS.find(g => g.id === groupId);
  steps   = group.scenarios[idx].steps;
  stepIdx = 0;
  assertErrors = 0;
  renderScenarioList();
  renderStepLog();
  document.getElementById('progress-bar').style.width = '0%';
}

/* ── 実行制御 ── */
function runScenario() {
  if (!API) return;
  if (steps.length === 0) {
    const g = SCENARIO_GROUPS.find(g => g.id === currentGroupId);
    if (!g) return;
    steps = g.scenarios[currentScenIdx].steps;
  }
  stepIdx = 0; assertErrors = 0;
  running = true; paused = false; stopped = false;
  setButtons('running');
  renderStepLog();
  runNext();
}

function pauseScenario() {
  paused = true; clearTimeout(timer); setButtons('paused');
  log('warn', '一時停止', 'ステップ ' + stepIdx + '/' + steps.length);
}

function resumeScenario() {
  paused = false; setButtons('running');
  log('info', '再開', 'ステップ ' + (stepIdx+1) + ' から再開');
  runNext();
}

function stopScenario() {
  running = false; paused = false; stopped = true;
  clearTimeout(timer); setButtons('idle');
}

function setButtons(state) {
  const run=document.getElementById('btn-run'), pause=document.getElementById('btn-pause'),
        resume=document.getElementById('btn-resume'), stop=document.getElementById('btn-stop');
  if (state==='running') {
    run.disabled=true; pause.disabled=false; stop.disabled=false;
    pause.style.display=''; resume.style.display='none';
  } else if (state==='paused') {
    run.disabled=true; pause.disabled=true; stop.disabled=false;
    pause.style.display='none'; resume.style.display=''; resume.disabled=false;
  } else {
    run.disabled=(API===null); pause.disabled=true; stop.disabled=true;
    pause.style.display=''; resume.style.display='none';
  }
}

function resetAll() {
  stopScenario();
  if (API) API.reset();
  stepIdx = 0; assertErrors = 0;
  steps = [];
  document.getElementById('progress-bar').style.width = '0%';
  document.getElementById('step-log').innerHTML = '';
  log('info', 'リセット完了', 'データを初期化しました');
}

/* ── ステップ実行 ── */
function runNext() {
  if (!running || paused || stopped) return;
  if (stepIdx >= steps.length) {
    running = false; setButtons('idle');
    document.getElementById('progress-bar').style.width = '100%';
    if (assertErrors > 0) {
      log('error', 'テスト完了（失敗あり）', assertErrors + '件のアサーション失敗');
    } else {
      log('ok', '✓ テスト完了', '全 ' + steps.length + ' ステップ成功');
    }
    return;
  }

  const step = steps[stepIdx];
  updateStepUI(stepIdx, 'run');
  document.getElementById('progress-bar').style.width = Math.round(stepIdx/steps.length*100)+'%';
  document.getElementById('preview-step').textContent = (stepIdx+1)+'/'+steps.length;

  try {
    step.action();
    updateStepUI(stepIdx, 'ok');
    stepIdx++;
    timer = setTimeout(runNext, getDelay());
  } catch(e) {
    updateStepUI(stepIdx, 'error', e.message);
    log('error', 'エラー: '+step.label, e.message);
    stopScenario();
  }
}

/* ── ログUI ── */
function renderStepLog() {
  const el = document.getElementById('step-log');
  el.innerHTML = steps.map((s,i) =>
    '<div class="step-item" id="step-'+i+'">'
    + '<span class="step-icon idle"><i class="ti ti-circle"></i></span>'
    + '<div><div class="step-label">'+s.label+'</div>'
    + (s.detail?'<div class="step-detail">'+s.detail+'</div>':'')+'</div>'
    + '<span class="step-status" id="step-status-'+i+'"></span>'
    + '</div>'
  ).join('');
}

function updateStepUI(idx, state, msg) {
  const item=document.getElementById('step-'+idx);
  const icon=item?.querySelector('.step-icon');
  const status=document.getElementById('step-status-'+idx);
  if (!item) return;
  const map={ok:{cls:'ok',icon:'ti-check',text:'✓'},error:{cls:'error',icon:'ti-x',text:'NG'},run:{cls:'run',icon:'ti-loader-2',text:'…'},idle:{cls:'idle',icon:'ti-circle',text:''}};
  const m=map[state]||map.idle;
  icon.className='step-icon '+m.cls;
  icon.innerHTML='<i class="ti '+m.icon+'"></i>';
  status.textContent=msg||m.text;
  if(state==='run') item.scrollIntoView({block:'nearest'});
}

function log(type, label, detail) {
  const icons={ok:'ti-check',error:'ti-x',warn:'ti-alert-triangle',info:'ti-info-circle'};
  const el=document.getElementById('step-log');
  const div=document.createElement('div');
  div.className='step-item';
  div.innerHTML='<span class="step-icon '+type+'"><i class="ti '+(icons[type]||'ti-info-circle')+'"></i></span>'
    +'<div><div class="step-label">'+label+'</div>'+(detail?'<div class="step-detail">'+detail+'</div>':'')+'</div>'
    +'<span class="step-status">'+new Date().toLocaleTimeString('ja-JP')+'</span>';
  el.appendChild(div);
  div.scrollIntoView({block:'nearest'});
}

/* ── カスタムシナリオ ── */
function toggleCustomPanel() {
  const p=document.getElementById('custom-panel');
  p.style.display=p.style.display==='none'?'flex':'none';
  if(p.style.display==='flex') p.style.flexDirection='column';
}
function closeCustomPanel() { document.getElementById('custom-panel').style.display='none'; }

function parseCustomScenario(jsonText) {
  const data=JSON.parse(jsonText);
  if(!data.steps||!Array.isArray(data.steps)) throw new Error('steps配列がありません');
  return { title: data.title||'カスタムシナリオ', steps: data.steps.map(s=>({ label:s.label||s.action, detail:s.detail||JSON.stringify(s), action:buildAction(s) })) };
}

function buildAction(s) {
  switch(s.action) {
    case 'reset':              return ()=>A().reset();
    case 'loginAsStaff':      return ()=>A().loginAsStaff(Number(s.staffId));
    case 'logout':             return ()=>A().logout();
    case 'transition':         return ()=>A().transition(s.event, s.payload||{});
    case 'jumpToState':        return ()=>A().jumpToState(s.state);
    case 'addShiftRequest':    return ()=>{ A().setFormValue('inp-shift-date',s.date||'2025-08-01'); A().setFormValue('inp-shift-start',s.start||'10:00'); A().setFormValue('inp-shift-end',s.end||'18:00'); F().addShiftRequest(); };
    case 'confirmShift':       return ()=>A().confirmShift(s.date, Number(s.staffId));
    case 'confirmAttendance':  return ()=>F().confirmAttendance(Number(s.staffId));
    case 'approveAbsence':     return ()=>F().approveAbsence(Number(s.staffId));
    case 'rejectAbsence':      return ()=>F().rejectAbsence(Number(s.staffId));
    case 'approveOvertime':    return ()=>F().approveOvertime(Number(s.staffId));
    case 'rejectOvertime':     return ()=>F().rejectOvertime(Number(s.staffId));
    case 'setClockIn':         return ()=>{ const st=F().DEMO.staff.find(s2=>s2.id===Number(s.staffId)); if(st) st.clockIn=s.time; F().updateGuideOnStateChange(); };
    case 'setClockOut':        return ()=>{ const st=F().DEMO.staff.find(s2=>s2.id===Number(s.staffId)); if(st) st.clockOut=s.time; F().updateGuideOnStateChange(); };
    case 'setStaffState':      return ()=>{ const st=F().DEMO.staff.find(s2=>s2.id===Number(s.staffId)); if(st){ st.state=s.state; } F().updateGuideOnStateChange(); };
    default: throw new Error('未知のアクション: '+s.action);
  }
}

function loadCustomScenario() {
  const json=document.getElementById('custom-json').value.trim();
  if(!json){ log('warn','入力なし','JSONを貼り付けてください'); return; }
  try {
    const sc=parseCustomScenario(json);
    // カスタムグループを追加または更新
    let cg=SCENARIO_GROUPS.find(g=>g.id==='custom');
    if(!cg){ cg={id:'custom',label:'カスタム',cls:'g-custom',scenarios:[]}; SCENARIO_GROUPS.push(cg); }
    cg.scenarios[0]=sc;
    currentGroupId='custom'; currentScenIdx=0;
    steps=sc.steps; stepIdx=0; assertErrors=0;
    renderScenarioList();
    renderStepLog();
    document.getElementById('progress-bar').style.width='0%';
    log('ok','読み込み完了: '+sc.title, sc.steps.length+'ステップ');
  } catch(e) {
    log('error','JSON解析エラー',e.message);
  }
}

function loadAndRun() {
  loadCustomScenario();
  setTimeout(()=>runScenario(), 300);
}

/* 初期化 */
renderScenarioList();
</script>
